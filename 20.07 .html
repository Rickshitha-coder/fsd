<script>
document.write("This is a javascript example")
console.log("This is a console log example")   
function displaymessage() {
    document.getElementById("h1").innerHTML = "Message changed!";
}
function doubleclick() {
    document.getElementById("h2").innerHTML = "Double click message changed!";
}
function downmouse() {
    document.getElementById("h3").innerHTML = "Mouse down message changed!";
}
function upmouse() {
    document.getElementById("h4").innerHTML = "Mouse up message changed!";
}
function overmouseclick() {
    document.getElementById("h5").style.color = "red";
}
function overmouse() {
    document.getElementById("h6").style.color = "red";
}

function outmouse() {
    document.getElementById("h6").style.color = "blue";
}
let counter = 0;
function count() {
    counter++;
    document.getElementById("h7").innerHTML = "Mouse move count: " + counter;
}
function rightclick() {
    event.preventDefault(); // Prevent the default context menu from appearing
    alert("Right click detected!");
}

function focusmsg() {
    document.getElementById("h9").innerHTML = "Password must contain at least 8 characters. ";
}

function showmsg() {
    document.getElementById("h10").innerHTML = "Password must contain at least 8 characters. ";
}
function blurmsg() {
    document.getElementById("h10").innerHTML = " ";
}

let b = document.getElementById("h11");  
b.addEventListener("click", show);  //action function name
 function show () {
    alert("Event listener activated!");
}
b.addEventListener("mouseover",colorchange);
function colorchange() {
    b.style.backgroundColor = "yellow";
}

b.addEventListener("mouseout",colorchange1);
function colorchange1() {
    b.style.backgroundColor = "white";
}
</script>
