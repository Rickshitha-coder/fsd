name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: 23-09/cicd-demo/package-lock.json

      - name: Install dependencies
        working-directory: 23-09/cicd-demo
        run: npm ci

      - name: Build project
        working-directory: 23-09/cicd-demo
        run: npm run build

      - name: Run tests
        working-directory: 23-09/cicd-demo
        run: npm test
